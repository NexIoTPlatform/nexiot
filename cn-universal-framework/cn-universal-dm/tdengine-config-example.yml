# ============================================================
# TDengine 设备日志存储配置示例
# ============================================================
# 使用说明：
# 1. 将此文件中的配置复制到 application.yml 或 application-xxx.yml
# 2. 修改连接参数为实际的 TDengine 服务器地址
# 3. 设置 tdengine.enable=true 启用 TDengine 存储
# ============================================================

tdengine:
  # 是否启用 TDengine 存储（默认关闭）
  enable: true
  
  # ============================================================
  # 连接配置
  # ============================================================
  
  # JDBC URL（根据连接方式选择）
  # 原生连接（需安装 TDengine 客户端，性能最佳）：
  url: jdbc:TAOS://127.0.0.1:6030/
  
  # WebSocket 连接（无需安装客户端，推荐云环境使用）：
  # url: jdbc:TAOS-RS://127.0.0.1:6041/
  
  # 用户名
  username: root
  
  # 密码
  password: taosdata
  
  # 数据库名称
  database: iot_log
  
  # TDengine 版本（2 或 3，影响 SQL 语法）
  version: 3
  
  # ============================================================
  # 表配置
  # ============================================================
  
  table:
    # 设备日志超级表名称
    iot_device_log: iot_device_log
    # 设备日志元数据超级表名称
    iot_device_log_metadata: iot_device_log_metadata
  
  # ============================================================
  # 连接池配置（HikariCP）
  # ============================================================
  
  pool:
    # 最大连接数（建议 CPU 核心数 * 2）
    max-size: 20
    # 最小空闲连接数
    min-idle: 5
    # 连接超时时间（毫秒）
    connection-timeout: 30000
  
  # ============================================================
  # 批量写入配置
  # ============================================================
  
  batch:
    # 批量写入大小（单次写入的最大记录数）
    size: 1000
  
  # ============================================================
  # 数据保留配置
  # ============================================================
  
  keep:
    # 数据保留天数（0 表示不限制，默认 365 天）
    days: 365

# ============================================================
# 产品存储策略配置
# ============================================================
# 在产品配置中设置 storePolicy 为 "tdengine" 以使用 TDengine 存储
# 示例：
# {
#   "productKey": "your_product_key",
#   "storePolicy": "tdengine"
# }

# ============================================================
# TDengine 安装说明
# ============================================================
# 
# Docker 快速部署（推荐）：
# docker run -d \
#   --name tdengine \
#   -p 6030:6030 \
#   -p 6041:6041 \
#   -p 6043-6060:6043-6060 \
#   -p 6043-6060:6043-6060/udp \
#   -v /path/to/data:/var/lib/taos \
#   -v /path/to/log:/var/log/taos \
#   tdengine/tdengine:latest
#
# 验证安装：
# taos -h 127.0.0.1 -u root -p
# 密码默认为：taosdata
#
# 官方文档：https://docs.tdengine.com/
# ============================================================

# ============================================================
# 性能调优建议
# ============================================================
#
# 1. 连接池配置：
#    - max-size 建议设置为 CPU 核心数的 2 倍
#    - 高并发场景可适当增加
#
# 2. 批量写入：
#    - 使用 batchInsertDeviceLogs 方法进行批量写入
#    - 单批次建议 1000-5000 条记录
#    - 过大的批次可能导致内存压力
#
# 3. 数据保留：
#    - 根据存储空间和业务需求设置 keep.days
#    - TDengine 自动清理过期数据
#
# 4. 超级表设计：
#    - TAG 字段用于存储设备标识（iot_id, device_id, product_key）
#    - 普通列存储时序数据
#    - 子表按 iot_id 自动分区
#
# ============================================================
