# NexIoT community defaults; private settings belong in config/runtime.env.
spring.profiles.active=${DB_PROFILE:postgresql}
spring.task.execution.threadNamePrefix=univ-excute-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=10
spring.task.execution.pool.keep-alive=10s
mybatis.configuration.map-underscore-to-camel-case=true
druid.mysql.usePingMethod=false
spring.mvc.hiddenmethod.filter.enabled=true
spring.servlet.multipart.max-file-size=${OTA_UPLOAD_MAX_FILE_SIZE:1024MB}
spring.servlet.multipart.max-request-size=${OTA_UPLOAD_MAX_REQUEST_SIZE:1024MB}
iot.export.max-size=20000
iot.export.timeout=30000
spring.quartz.scheduler-name=UnivScheduler
spring.quartz.startup-delay=1s
spring.quartz.overwrite-existing-jobs=true
spring.quartz.auto-startup=true
spring.quartz.job-store-type=JDBC
spring.quartz.properties.org.quartz.scheduler.instanceName=UnivScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.batchTriggerAcquisitionMaxCount=5
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadCount=20
spring.quartz.properties.org.quartz.threadPool.threadPriority=5
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=150000
spring.quartz.properties.org.quartz.jobStore.txIsolationLevelSerializable=false
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=600000
spring.quartz.properties.org.quartz.jobStore.tablePrefix=qrtz_
spring.quartz.properties.org.quartz.jobStore.acquireTriggersWithinLock=true
spring.quartz.properties.org.quartz.jobStore.dataSource=quartzDs
cn.universal.xss.skipUrl[0]=/iot/weixin/**
cn.universal.xss.skipUrl[1]=/admin/v1/protocol/**
cn.universal.xss.skipUrl[2]=/admin/v1/product/**
cn.universal.xss.skipUrl[3]=/magic/**
cn.universal.xss.skipUrl[4]=/admin/v1/rule/sql/**
cn.universal.xss.skipUrl[5]=/admin/v1/gateway/polling/**
cn.universal.xss.skipUrl[6]=/admin/v1/apply/transform/**
nexiot.api.crypto.enabled=${NEXIOT_API_CRYPTO_ENABLED:false}
nexiot.api.crypto.param-name=${NEXIOT_API_CRYPTO_PARAM_NAME:data}
nexiot.api.crypto.aes-key=${NEXIOT_API_CRYPTO_AES_KEY:}
nexiot.security.certificate-master-key=${NEXIOT_CERTIFICATE_MASTER_KEY:}
nexiot.api.crypto.support-text-plain=${NEXIOT_API_CRYPTO_SUPPORT_TEXT_PLAIN:true}
spring.main.allow-circular-references=true
spring.security.oauth2.authorizationserver.issuer=${OAUTH2_ISSUER:http://localhost:9092}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${spring.security.oauth2.authorizationserver.issuer}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=cn-universal
management.prometheus.metrics.export.enabled=true
lombok.experimental.superBuilder=true
logging.level.org.springframework.jcl=OFF
logging.level.org.apache.commons.logging=OFF
logging.level.org.apache.commons.logging.impl=OFF
nexiot.ide.debug.enabled=true
nexiot.ide.debug.web=/magic/debug
nexiot.ide.debug.prefix=/magic
nexiot.ide.debug.editor-config=classpath:./magic-editor-config.js
nexiot.ide.debug.resource.type=database
nexiot.ide.debug.resource.datasource=
nexiot.ide.debug.resource.prefix=universal
nexiot.ide.debug.resource.tableName=protocol_file
nexiot.ide.debug.backup.enable=true
nexiot.ide.debug.backup.datasource=
nexiot.ide.debug.backup.max-history=30
nexiot.ide.debug.backup.table-name=protocol_file_backup
security.request-sign.secret=${REQUEST_SIGN_SECRET:nexiot}
video.fusion.scheduler.enabled=false
video.fusion.overlay-stream.enabled=false
video.fusion.shadow-event-enabled=false
video.fusion.frontend-osd.event-enabled=false
video.sdk.subscription.recovery-enabled=false
